[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-engine-lite-runtime"
version = "0.1.0"
description = "Local runtime substrate for Knowledge Engine Lite"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.15.2",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.6",
  "PyYAML==6.0.2",
  "SQLAlchemy==2.0.40",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
  "pytest-asyncio==0.25.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "integration: requires a working Docker Compose v2 daemon",
]
